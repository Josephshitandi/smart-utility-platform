          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTariffRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTariffRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTariffRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
          description: ''
    delete:
      operationId: v1_billing_tariffs_destroy
      description: |-
        Retrieve, update or delete a tariff.
        Only administrators can update or delete tariffs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
