          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
          description: ''
  /api/v1/billing/tariffs/{id}/:
    get:
      operationId: v1_billing_tariffs_retrieve
      description: |-
        Retrieve, update or delete a tariff.
        Only administrators can update or delete tariffs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tariff'
          description: ''
    put:
      operationId: v1_billing_tariffs_update
      description: |-
        Retrieve, update or delete a tariff.
        Only administrators can update or delete tariffs.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffRequest'
          application/x-www-form-urlencoded:
            schema:
