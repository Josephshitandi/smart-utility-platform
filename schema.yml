openapi: 3.0.3
info:
  title: Smart Utility Platform API
  version: 1.0.0
  description: "\n    API documentation for the Smart Utility Management Platform.\n\n
    \   The API provides functionality for:\n    - User and account management\n    -
    Meter management\n    - Meter readings\n    - Billing and tariffs\n    - Payments
    and financial ledger\n    - Customer support and tickets\n\n    Authentication
    uses JWT Bearer tokens.\n    "
paths:
  /api/v1/auth/administrator/:
    get:
      operationId: v1_auth_administrator_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdministratorDashboardResponse'
          description: ''
  /api/v1/auth/dashboard/:
    get:
      operationId: v1_auth_dashboard_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDashboardResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/v1/auth/profile/:
    get:
      operationId: v1_auth_profile_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
